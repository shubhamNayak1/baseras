    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#0B1F3A',
              teal: {
                DEFAULT: '#1FB6A6',
                hover: '#199b8d'
              },
              skyblue: '#38BDF8',
              lightgray: '#F5F7FA',
              ink: '#050B18',

            },

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
      }

      /* ---------- Motion system ---------- */
      @keyframes gradient-pan { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
      @keyframes float-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes grid-scroll { from { background-position: 0 0; } to { background-position: 0 64px; } }
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      @keyframes spin-slow { to { transform: rotate(360deg); } }
      @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
      @keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(400%); } }
      @keyframes row-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      .text-gradient {
        background: linear-gradient(90deg, #1FB6A6, #38BDF8, #818CF8, #1FB6A6);
        background-size: 200% auto;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: gradient-pan 6s linear infinite;
      }
      .float-y { animation: float-y 6s ease-in-out infinite; }
      .pulse-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
      .row-in { animation: row-in .5s ease-out both; }
      .marquee-track { animation: marquee 40s linear infinite; }
      .marquee:hover .marquee-track { animation-play-state: paused; }

      /* perspective grid floor */
      .grid-floor {
        background-image:
          linear-gradient(rgba(56,189,248,.13) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56,189,248,.13) 1px, transparent 1px);
        background-size: 64px 64px;
        transform: perspective(500px) rotateX(62deg);
        transform-origin: center top;
        animation: grid-scroll 3s linear infinite;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 60%, transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 60%, transparent);
      }
      .dot-grid {
        background-image: radial-gradient(rgba(148,163,184,.18) 1px, transparent 1px);
        background-size: 28px 28px;
      }

      /* glass card with mouse-follow spotlight + glowing edge */
      .glass {
        background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
        border: 1px solid rgba(255,255,255,.09);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      }
      .spotlight { position: relative; isolation: isolate; }
      .spotlight::before {
        content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
        background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(31,182,166,.16), transparent 45%);
        opacity: 0; transition: opacity .3s;
      }
      .spotlight::after {
        content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
        background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), rgba(56,189,248,.8), transparent 50%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        opacity: 0; transition: opacity .3s;
      }
      .spotlight:hover::before, .spotlight:hover::after { opacity: 1; }

      /* rotating conic border for the CTA */
      .conic-border { position: relative; overflow: hidden; }
      .conic-border::before {
        content: ''; position: absolute; inset: -150%; z-index: 0;
        background: conic-gradient(from 0deg, transparent 0 70%, #1FB6A6 80%, #38BDF8 90%, transparent 100%);
        animation: spin-slow 6s linear infinite;
      }
      .conic-border > .conic-inner { position: relative; z-index: 1; }

      .scanline { animation: scan 4s linear infinite; }

      /* outlined card numbers (01, 02, 03) that fill with the brand gradient on hover */
      .num-outline {
        color: transparent;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 1.5px rgba(56,189,248,.75);
        background-image: linear-gradient(135deg, #1FB6A6, #38BDF8);
        background-size: 0% 100%;
        background-repeat: no-repeat;
        -webkit-background-clip: text; background-clip: text;
        filter: drop-shadow(0 0 10px rgba(56,189,248,.3));
        transition: background-size .6s cubic-bezier(.2,.7,.2,1), filter .4s;
      }
      .group:hover .num-outline {
        background-size: 100% 100%;
        filter: drop-shadow(0 0 18px rgba(56,189,248,.6));
      }

      /* scroll reveal */
      .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }
      .reveal.is-visible { opacity: 1; transform: none; }

      /* ---------- Opening intro ---------- */
      @keyframes draw-stroke { to { stroke-dashoffset: 0; } }
      @keyframes pop-in { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
      @keyframes title-in { to { opacity: 1; letter-spacing: .35em; } }
      @keyframes blink { 50% { opacity: 0; } }
      .intro { background: #050B18; transition: background-color .8s ease; }
      .intro.burst { background: rgba(5,11,24,0); pointer-events: none; }
      .intro-mark { transition: transform .8s cubic-bezier(.2,.7,.2,1), opacity .7s ease; }
      .intro.burst .intro-mark { transform: scale(1.9); opacity: 0; }
      .intro-hex { stroke-dasharray: 270; stroke-dashoffset: 270; animation: draw-stroke 1s cubic-bezier(.6,0,.3,1) forwards; filter: drop-shadow(0 0 10px rgba(56,189,248,.8)); }
      .intro-circle { stroke-dasharray: 155; stroke-dashoffset: 155; animation: draw-stroke .6s .7s ease-out forwards; }
      .intro-dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .35s ease-out forwards; }
      .intro-title { opacity: 0; letter-spacing: .7em; animation: title-in 1s .4s ease-out forwards; }
      .caret { animation: blink 1s steps(1) infinite; }

      /* headline lines slide up from behind a mask */
      .line-mask { display: block; overflow: hidden; padding-bottom: .12em; margin-bottom: -.12em; }
      .line-mask > span { display: block; transform: translateY(110%); transition: transform 1.1s cubic-bezier(.2,.7,.2,1); }
      .reveal.is-visible .line-mask > span { transform: none; }

      /* swipeable product carousel on phones */
      .no-scrollbar { scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      @media (max-width: 767px) {
        .carousel .reveal { opacity: 1; transform: none; } /* the carousel fades in as one block */
      }

      /* phones/tablets: skip the costly frosted blur over the animated background, and fade in faster */
      @media (max-width: 1023px) {
        .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(180deg, rgba(16,32,56,.92), rgba(10,22,40,.92)); }
        .reveal { transform: translateY(16px); transition-duration: .45s; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
        .reveal { opacity: 1; transform: none; }
        .line-mask > span { transform: none; }
      }
    </style>
